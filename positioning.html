<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Đức Thiện - Positioning Playground</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <header class="fixed-header">
        <div class="logo">Thiện Store</div>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="layout-container">
        <aside class="sticky-sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li>Thời trang nam</li>
                <li>Thời trang nữ</li>
                <li>Phụ kiện</li>
            </ul>
        </aside>

        <main class="content">
            <h2>Sản phẩm nổi bật</h2>
            
            <div class="product-card">
                <span class="badge-hot">HOT</span>
                <img src="https://placehold.co/150x150" alt="Sản phẩm demo">
                <h3>Áo Thun C++</h3>
                <p>Giá: 250.000đ</p>
                <button>Mua ngay</button>
            </div>

            <div class="scroll-space">
            
               
            </div>
        </main>
    </div>

    <button class="scroll-to-top" title="Lên đầu trang">↑</button>

</body>
</html>
