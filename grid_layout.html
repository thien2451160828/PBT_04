<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Đức Thiện - E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="grid-container">
        
        <header class="header">
            <h2>Thiện Store - E-Commerce</h2>
        </header>

        <section class="hero">
            <div class="hero-content">
                <h1>Siêu Sale Mùa Hè!</h1>
                <p>Giảm giá cực sốc lên đến 50% cho tất cả các mặt hàng đồ công nghệ.</p>
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc sản phẩm</h3>
            <hr>
            <div class="filter-group">
                <label><input type="checkbox"> Laptop Gaming</label><br>
                <label><input type="checkbox"> Điện thoại di động</label><br>
                <label><input type="checkbox"> Phụ kiện bida</label><br>
                <label><input type="checkbox"> Khuyến mãi HOT</label>
            </div>
        </aside>

        <main class="main-content">
            <div class="product-grid">
                <div class="card featured-card">
                    <img src="https://placehold.co/500x200?text=HERO+PRODUCT" alt="Nổi bật">
                    <h3>Laptop Asus TUF F15</h3>
                    <p class="price">20.500.000đ</p>
                </div>
                
                <div class="card">
                    <img src="https://placehold.co/200x150?text=SP+2" alt="SP">
                    <h3>Gậy Bida Custom</h3>
                </div>
                <div class="card">
                    <img src="https://placehold.co/200x150?text=SP+3" alt="SP">
                    <h3>Tay cầm Xbox</h3>
                </div>
                <div class="card">
                    <img src="https://placehold.co/200x150?text=SP+4" alt="SP">
                    <h3>Bàn phím cơ</h3>
                </div>
                <div class="card">
                    <img src="https://placehold.co/200x150?text=SP+5" alt="SP">
                    <h3>Chuột Logitech</h3>
                </div>
                <div class="card">
                    <img src="https://placehold.co/200x150?text=SP+6" alt="SP">
                    <h3>Lót chuột XL</h3>
                </div>
            </div>
        </main>

        <aside class="ads">
            <h3>Tài trợ</h3>
            <img src="https://placehold.co/160x400?text=BANNER+ADS" alt="Quảng cáo">
        </aside>

        <footer class="footer">
            <p>&copy; 2026 Trần Đức Thiện. All rights reserved.</p>
        </footer>

    </div>
</body>
</html>
